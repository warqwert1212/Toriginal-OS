set timeout=5
set default=0

# ── Load essential modules ─────────────────────────────────────────────────
insmod part_msdos
insmod part_gpt
insmod iso9660
insmod search_fs_file
insmod multiboot2
insmod serial
insmod echo
insmod all_video
insmod efi_gop
insmod font

# ── Serial port for debug output ──────────────────────────────────────────
serial --unit=0 --speed=38400 --word=8 --parity=no --stop=1
terminal_input  console serial
terminal_output console serial

# ── Menu entry 1: Install / boot Toriginal OS ─────────────────────────────
menuentry "Install / Boot Toriginal OS" {
    echo "Searching for Toriginal OS kernel..."

    search --no-floppy --file --set=root /boot/root/freeNT
    search --no-floppy --file --set=root /boot/root/installer
  
    echo "Booting installer..."
    multiboot2 /boot/root/installer
	boot 

    echo "Loading kernel..."
    multiboot2 /boot/root/freeNT

}

# ── Menu entry 2: Easter-egg / about screen ───────────────────────────────
menuentry "About Toriginal OS" {
    echo ""
    echo " ******************************"
    echo " |                            ||"
    echo " |____________________________||"
    echo "          |        ||  /\     /\"
    echo "          |        || /  \   /  \ "
    echo "          |        ||(  /\   /\  )"
    echo "          |        ||      __    "
    echo "          |        ||"
    echo "          |        ||"
    echo "          |        ||"
    echo "          |        ||"
    echo "          |________||"
    echo "  TORIGINAL OS  —  made by warqwert"
    echo ""
    echo "  [ Press ENTER to return ]"
    read ignored
}

# ── Menu entry 3: GRUB command line ───────────────────────────────────────
menuentry "GRUB Command Line" {
    echo "Entering GRUB command line..."
    terminal_input  console
    terminal_output console
    commandline
}