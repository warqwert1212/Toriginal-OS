set timeout=5
set default=0

insmod vbe
insmod video_bochs
insmod video_cirrus
insmod efi_gop
insmod all_video
set gfxpayload=keep

menuentry "toriginal_OS" {
  multiboot2 /boot/kernel.elf
  module2 /boot/osimage.img /system/osimage.img
  module2 /boot/trp/partitionmanager.trp /system/trp/partitionmanager.trp
  module2 /boot/trp/teroobe.trp /system/trp/teroobe.trp
  module2 /boot/trp/terminal.trp /system/trp/terminal.trp
  module2 /boot/trp/settings.trp /system/trp/settings.trp
  module2 /boot/trp/packages.trp /system/trp/packages.trp
  module2 /boot/trp/computer.trp /system/trp/computer.trp
  module2 /boot/trp/welcome.trp /system/trp/welcome.trp
  module2 /boot/trp/notepad.trp /system/trp/notepad.trp
  boot
}

menuentry "toriginal_OS (start in GUI)" {
  multiboot2 /boot/kernel.elf gui
  module2 /boot/osimage.img /system/osimage.img
  module2 /boot/trp/partitionmanager.trp /system/trp/partitionmanager.trp
  module2 /boot/trp/teroobe.trp /system/trp/teroobe.trp
  module2 /boot/trp/terminal.trp /system/trp/terminal.trp
  module2 /boot/trp/settings.trp /system/trp/settings.trp
  module2 /boot/trp/packages.trp /system/trp/packages.trp
  module2 /boot/trp/computer.trp /system/trp/computer.trp
  module2 /boot/trp/welcome.trp /system/trp/welcome.trp
  module2 /boot/trp/notepad.trp /system/trp/notepad.trp
  boot
}

